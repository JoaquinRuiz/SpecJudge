name: Release

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is OIDC (PyPI "Trusted Publisher") — there is no API token in
# this repository. PyPI verifies the request came from this exact workflow, in
# this repository, in the `pypi` environment.
#
# Trusted publisher settings that must match on PyPI:
#   Owner: JoaquinRuiz · Repository: SpecJudge
#   Workflow: release.yml · Environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Don't ship something the suite hasn't seen.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run --extra dev pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the wheel installs and runs
        run: |
          uv tool install --force ./dist/*.whl
          specjudge --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/specjudge
    permissions:
      id-token: write # required for OIDC; this is what replaces the API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    name: Attach the spec-kit extension
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload the archive onto the release
    steps:
      - uses: actions/checkout@v5

      # spec-kit unpacks the archive and expects `extension.yml` at its root, so the
      # zip GitHub generates from a tag is the wrong shape: it would nest everything
      # under `SpecJudge-<tag>/extensions/spec-kit/`. Build it from the directory.
      - name: Build the extension archive
        run: |
          cd extensions/spec-kit
          zip -r "$GITHUB_WORKSPACE/spec-kit-specjudge.zip" . -x '.*'
          unzip -l "$GITHUB_WORKSPACE/spec-kit-specjudge.zip"

      - name: Fail if the manifest is not at the archive root
        run: |
          unzip -l spec-kit-specjudge.zip | grep -qE ' extension\.yml$' \
            || { echo "extension.yml is not at the root of the archive"; exit 1; }

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" spec-kit-specjudge.zip --clobber
